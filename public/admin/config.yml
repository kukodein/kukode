backend:
  name: github
  repo: kukodein/kukode
  branch: main
local_backend: true
media_folder: public/image
public_folder: /image
i18n:
  structure: multiple_folders
  locales:
  - en
  - id
  default_locale: en
collections:
- name: pages
  label: Pages
  label_singular: Page
  folder: src/content/pages
  create: true
  i18n: true
  slug: '{{slug}}'
  summary: '{{page.title}} ({{page.template}})'
  fields:
  - label: Custom Slug
    name: custom_slug
    widget: string
    required: false
    i18n: true
    hint: Custom URL slug for this language (e.g. 'about' for EN, 'tentang' for ID). If empty, filename/title slug is used.
  - label: Translation Key
    name: translation_key
    widget: string
    required: false
    i18n: duplicate
    hint: Unique key to link English and Indonesian pages together when their slugs differ (e.g. 'about-us').
  - label: SEO Settings
    name: seo
    widget: object
    i18n: true
    fields:
    - label: Meta Title
      name: title
      widget: string
      required: false
      i18n: true
    - label: Meta Description
      name: description
      widget: text
      required: false
      i18n: true
    - label: Meta Image
      name: image
      widget: image
      required: false
      i18n: true
  - label: Draft
    name: draft
    widget: boolean
    default: false
    i18n: true
  - label: Page
    name: page
    widget: object
    typeKey: template
    i18n: true
    types:
    - name: default
      label: Default Page
      i18n: true
      fields:
      - label: Title
        name: title
        widget: string
        i18n: true
      - label: Content
        name: content
        widget: markdown
        i18n: true
    - name: about
      label: About Page
      i18n: true
      fields:
      - label: Title
        name: title
        widget: string
        i18n: true
      - label: Hero Section
        name: hero
        widget: object
        i18n: true
        fields:
        - label: Hero Title
          name: hero_title
          widget: string
          i18n: true
        - label: Hero Description
          name: hero_description
          widget: text
          required: false
          i18n: true
        - label: Hero Image
          name: hero_image
          widget: image
          required: false
          i18n: true
      - label: Content
        name: content
        widget: markdown
        i18n: true
    - name: contact
      label: Contact Page
      i18n: true
      fields:
      - label: Title
        name: title
        widget: string
        i18n: true
      - label: Hero Section
        name: hero
        widget: object
        i18n: true
        fields:
        - label: Hero Title
          name: hero_title
          widget: string
          i18n: true
      - label: Content
        name: content
        widget: markdown
        i18n: true
      - label: Form Email Forward
        name: form_email_forward
        widget: string
        required: false
        hint: Email tujuan pengiriman form kontak
        i18n: true
    - name: service
      label: Service Page
      i18n: true
      fields:
      - label: Title
        name: title
        widget: string
        i18n: true
      - label: Service Badge / Tag
        name: badge
        widget: string
        required: false
        i18n: true
        hint: Contoh 'Layanan Unggulan Kukode' atau 'Featured Flagship Service'
      - label: Hero Section
        name: hero
        widget: object
        i18n: true
        fields:
        - label: Hero Title
          name: hero_title
          widget: string
          i18n: true
        - label: Hero Description
          name: hero_description
          widget: text
          required: false
          i18n: true
        - label: Hero Image
          name: hero_image
          widget: image
          required: false
          i18n: duplicate
        - label: Primary CTA Text
          name: cta_primary_text
          widget: string
          required: false
          i18n: true
        - label: Primary CTA Link
          name: cta_primary_link
          widget: string
          required: false
          i18n: duplicate
        - label: Secondary CTA Text
          name: cta_secondary_text
          widget: string
          required: false
          i18n: true
        - label: Secondary CTA Link
          name: cta_secondary_link
          widget: string
          required: false
          i18n: duplicate
        - label: Metric 1 (Load Time)
          name: stat_1
          widget: string
          required: false
          default: "< 0.8s"
          i18n: duplicate
        - label: Metric 2 (Uptime)
          name: stat_2
          widget: string
          required: false
          default: "99.9%"
          i18n: duplicate
        - label: Metric 3 (PageSpeed)
          name: stat_3
          widget: string
          required: false
          default: "100"
          i18n: duplicate
      - label: Website Types & Solutions (Solusi Website)
        name: website_types
        widget: list
        required: false
        i18n: true
        fields:
        - label: Icon Emoji / Text
          name: icon
          widget: string
          i18n: duplicate
        - label: Title
          name: title
          widget: string
          i18n: true
        - label: Tag Badge
          name: tag
          widget: string
          required: false
          i18n: true
        - label: Description
          name: desc
          widget: text
          i18n: true
      - label: Architectural Comparison (Perbandingan Arsitektur)
        name: comparison
        widget: object
        required: false
        i18n: true
        fields:
        - label: Legacy System Title
          name: legacy_title
          widget: string
          default: "Website WordPress / Tradisional"
          i18n: true
        - label: Legacy Disadvantages
          name: legacy_items
          widget: list
          i18n: true
          fields:
          - label: Title
            name: title
            widget: string
            i18n: true
          - label: Description
            name: desc
            widget: text
            i18n: true
        - label: Modern Architecture Title
          name: modern_title
          widget: string
          default: "Arsitektur Modern Kukode"
          i18n: true
        - label: Modern Badge
          name: modern_badge
          widget: string
          default: "Standar Modern 2026"
          i18n: true
        - label: Modern Advantages
          name: modern_items
          widget: list
          i18n: true
          fields:
          - label: Title
            name: title
            widget: string
            i18n: true
          - label: Description
            name: desc
            widget: text
            i18n: true
      - label: Deliverables Pillars (Rincian Output Proyek)
        name: deliverables
        widget: list
        required: false
        i18n: true
        fields:
        - label: Category Title
          name: category
          widget: string
          i18n: true
        - label: Icon Emoji
          name: icon
          widget: string
          i18n: duplicate
        - label: Deliverables List
          name: items
          widget: list
          i18n: true
      - label: Pricing Packages (Pilihan Paket & Harga)
        name: pricing_packages
        widget: list
        required: false
        i18n: true
        fields:
        - label: Package Name
          name: name
          widget: string
          i18n: true
        - label: Price
          name: price
          widget: string
          i18n: true
        - label: Period / Frequency
          name: period
          widget: string
          default: "sekali bayar"
          i18n: true
        - label: Featured Badge
          name: badge
          widget: string
          required: false
          i18n: true
        - label: Description
          name: desc
          widget: text
          i18n: true
        - label: Included Features
          name: features
          widget: list
          i18n: true
        - label: CTA Button Text
          name: cta_text
          widget: string
          default: "Pilih Paket"
          i18n: true
        - label: Is Featured / Highlighted
          name: featured
          widget: boolean
          default: false
          i18n: duplicate
      - label: Code Ownership Guarantee Text
        name: ownership_guarantee
        widget: text
        required: false
        i18n: true
      - label: Tech Stack (Daftar Stack & Logo)
        name: tech_stack
        widget: list
        required: false
        i18n: true
        fields:
        - label: Tech Name
          name: name
          widget: string
          i18n: duplicate
        - label: Category / Role
          name: role
          widget: string
          i18n: true
        - label: Description
          name: desc
          widget: text
          i18n: true
        - label: Logo Icon (SVG / Image)
          name: logo
          widget: image
          required: false
          i18n: duplicate
      - label: Add-ons (Layanan Tambahan Opsional)
        name: add_ons
        widget: list
        required: false
        i18n: true
        fields:
        - label: Title
          name: title
          widget: string
          i18n: true
        - label: Description
          name: desc
          widget: text
          i18n: true
      - label: Work Process Steps (Tahapan Pengerjaan)
        name: process_steps
        widget: list
        required: false
        i18n: true
        fields:
        - label: Step Number
          name: step_number
          widget: string
          i18n: duplicate
        - label: Step Title
          name: title
          widget: string
          i18n: true
        - label: Duration
          name: duration
          widget: string
          required: false
          i18n: true
        - label: Step Description
          name: desc
          widget: text
          i18n: true
      - label: FAQ (Tanya Jawab Interaktif)
        name: faq
        widget: list
        required: false
        i18n: true
        fields:
        - label: Question
          name: question
          widget: string
          i18n: true
        - label: Answer
          name: answer
          widget: text
          i18n: true
      - label: Call-to-Action Band
        name: cta_band
        widget: object
        required: false
        i18n: true
        fields:
        - label: Heading
          name: heading
          widget: string
          i18n: true
        - label: Description
          name: description
          widget: text
          i18n: true
        - label: Button Text
          name: cta_text
          widget: string
          i18n: true
        - label: Button Link
          name: cta_link
          widget: string
          required: false
          i18n: duplicate
        - label: Guarantee / Subtext
          name: guarantee_text
          widget: string
          required: false
          i18n: true
      - label: Content / Additional Markdown
        name: content
        widget: markdown
        required: false
        i18n: true
- name: posts
  label: Posts
  label_singular: Post
  folder: src/content/posts
  create: true
  i18n: true
  slug: '{{slug}}'
  fields:
  - label: Title
    name: title
    widget: string
    i18n: true
  - label: Custom Slug
    name: custom_slug
    widget: string
    required: false
    i18n: true
    hint: Custom URL slug for this language (e.g. 'what-is-an-api' vs 'apa-itu-api').
      If empty, filename/title is used.
  - label: Translation Key
    name: translation_key
    widget: string
    required: false
    i18n: duplicate
    hint: Unique key linking English and Indonesian versions together when slugs differ
      (e.g. 'api-intro'). Leave blank if post is standalone.
  - label: Description
    name: description
    widget: text
    required: false
    i18n: true
  - label: SEO Settings
    name: seo
    widget: object
    i18n: true
    fields:
    - label: Meta Title
      name: title
      widget: string
      required: false
      i18n: true
    - label: Meta Description
      name: description
      widget: text
      required: false
      i18n: true
    - label: Meta Image
      name: image
      widget: image
      required: false
      i18n: true
  - label: Publish Date
    name: pubDate
    widget: datetime
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
    i18n: true
  - label: Updated Date
    name: updatedDate
    widget: datetime
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
    required: false
    i18n: true
  - label: Featured Image
    name: image
    widget: image
    required: false
    i18n: true
  - label: Category
    name: category
    widget: relation
    collection: categories
    search_fields:
    - name
    value_field: name
    display_fields:
    - name
    i18n: true
  - label: Author
    name: author
    widget: relation
    collection: authors
    search_fields:
    - name
    value_field: name
    display_fields:
    - name
    i18n: true
  - label: Draft
    name: draft
    widget: boolean
    default: false
    i18n: true
  - label: Body
    name: body
    widget: markdown
    i18n: true
- name: authors
  label: Authors
  label_singular: Author
  folder: src/content/authors
  create: true
  i18n: true
  slug: '{{slug}}'
  fields:
  - label: Name
    name: name
    widget: string
    i18n: true
  - label: Custom Slug
    name: custom_slug
    widget: string
    required: false
    i18n: true
    hint: Custom URL slug for this author. If empty, filename is used.
  - label: Role / Title
    name: role
    widget: string
    required: false
    i18n: true
  - label: Bio
    name: bio
    widget: text
    required: false
    i18n: true
  - label: Avatar
    name: avatar
    widget: image
    required: false
    i18n: true
  - label: Email
    name: email
    widget: string
    required: false
    i18n: true
  - label: Instagram
    name: instagram
    widget: string
    required: false
    i18n: true
  - label: Website
    name: website
    widget: string
    required: false
    i18n: true
  - label: SEO Settings
    name: seo
    widget: object
    i18n: true
    fields:
    - label: Meta Title
      name: title
      widget: string
      required: false
      i18n: true
    - label: Meta Description
      name: description
      widget: text
      required: false
      i18n: true
    - label: Meta Image
      name: image
      widget: image
      required: false
      i18n: true
- name: categories
  label: Categories
  label_singular: Category
  folder: src/content/categories
  create: true
  i18n: true
  slug: '{{slug}}'
  fields:
  - label: Name
    name: name
    widget: string
    i18n: true
  - label: Custom Slug
    name: slug
    widget: string
    required: false
    i18n: true
  - label: Translation Key
    name: translation_key
    widget: string
    required: false
    i18n: duplicate
  - label: Description
    name: description
    widget: text
    required: false
    i18n: true
- name: portfolio
  label: Portfolio
  label_singular: Portfolio Project
  folder: src/content/portfolio
  create: true
  i18n: false
  slug: '{{slug}}'
  fields:
  - label: Project Title
    name: title
    widget: string
  - label: Custom Slug
    name: custom_slug
    widget: string
    required: false
    hint: URL slug (e.g. 'project-one'). If blank, filename is used.
  - label: Category
    name: category
    widget: select
    options:
    - Company Profile
    - E-Commerce
    - Landing Page
    - Blog
    - Portfolio
    - Web App
    - Custom Development
    default: Company Profile
  - label: Client Name
    name: client
    widget: string
    required: false
  - label: Year
    name: year
    widget: string
    required: false
  - label: Short Description
    name: description
    widget: text
    required: false
  - label: Cover Image
    name: image
    widget: image
    required: false
  - label: Live Project URL
    name: live_url
    widget: string
    required: false
  - label: Tech Stack / Tools Used
    name: tools
    widget: list
    required: false
  - label: Featured on Homepage
    name: featured
    widget: boolean
    default: false
    required: false
  - label: Draft
    name: draft
    widget: boolean
    default: false
  - label: Project Case Study / Details
    name: body
    widget: markdown
    required: false
  - label: Project Gallery
    name: gallery
    widget: list
    required: false
    hint: Screenshot atau mockup visual proyek (dapat diperbesar pengunjung dengan GLightbox)
    fields:
      - label: Image
        name: image
        widget: image
      - label: Caption / Title
        name: caption
        widget: string
        required: false
  - label: SEO Settings
    name: seo
    widget: object
    fields:
    - label: Meta Title
      name: title
      widget: string
      required: false
    - label: Meta Description
      name: description
      widget: text
      required: false
    - label: Meta Image
      name: image
      widget: image
      required: false
- name: settings
  label: Site Settings
  delete: false
  i18n: true
  editor:
    preview: false
  files:
  - name: general
    label: General Settings
    file: src/content/settings/{{locale}}/general.json
    i18n: true
    fields:
    - label: Logo Light Mode
      name: logo_light
      widget: image
      default: /image/Logo-Kukode-Landscape.png
      i18n: true
      hint: Used on light background in Header & Footer
    - label: Logo Dark Mode
      name: logo_dark
      widget: image
      default: /image/Logo-Kukode-Landscape-White.png
      i18n: true
      hint: Used on dark background in Header & Footer
    - label: Header Navigation
      name: header_nav
      widget: list
      i18n: true
      fields:
      - label: Menu Label
        name: label
        widget: string
        i18n: true
      - label: Menu URL
        name: url
        widget: string
        i18n: true
    - label: Header CTA Button Text
      name: header_cta_text
      widget: string
      default: Get a Quote
      i18n: true
    - label: Header CTA Button Link
      name: header_cta_url
      widget: string
      default: /#contact
      i18n: true
    - label: Footer Column 1
      name: footer_col_1
      widget: object
      i18n: true
      fields:
      - label: Column Title
        name: title
        widget: string
        default: Navigation
        i18n: true
      - label: Menu Links
        name: items
        widget: list
        i18n: true
        fields:
        - label: Label
          name: label
          widget: string
          i18n: true
        - label: URL
          name: url
          widget: string
          i18n: true
    - label: Footer Column 2
      name: footer_col_2
      widget: object
      i18n: true
      fields:
      - label: Column Title
        name: title
        widget: string
        default: Social
        i18n: true
      - label: Menu Links
        name: items
        widget: list
        i18n: true
        fields:
        - label: Label
          name: label
          widget: string
          i18n: true
        - label: URL
          name: url
          widget: string
          i18n: true
    - label: Footer Column 3
      name: footer_col_3
      widget: object
      i18n: true
      fields:
      - label: Column Title
        name: title
        widget: string
        default: Contact
        i18n: true
      - label: Menu Links
        name: items
        widget: list
        i18n: true
        fields:
        - label: Label
          name: label
          widget: string
          i18n: true
        - label: URL
          name: url
          widget: string
          i18n: true
    - label: Footer Description (Markdown / WYSIWYG)
      name: footer_description
      widget: markdown
      required: false
      i18n: true
    - label: Social Media Links
      name: social_media
      widget: object
      required: false
      i18n: true
      fields:
      - label: Instagram URL
        name: instagram
        widget: string
        required: false
        i18n: true
        hint: e.g. https://www.instagram.com/kukode.id
      - label: Facebook URL
        name: facebook
        widget: string
        required: false
        i18n: true
        hint: e.g. https://www.facebook.com/kukodein
      - label: YouTube URL
        name: youtube
        widget: string
        required: false
        i18n: true
        hint: e.g. https://www.youtube.com/@kukode_id
      - label: WhatsApp URL
        name: whatsapp
        widget: string
        required: false
        i18n: true
        hint: e.g. https://wa.me/62853293353541
      - label: LinkedIn URL
        name: linkedin
        widget: string
        required: false
        i18n: true
        hint: e.g. https://www.linkedin.com/company/kukode
    - label: Copyright Text (Year auto-inserted)
      name: copyright_text
      widget: string
      default: Kukode Digital Technology · All rights reserved.
      i18n: true
  - name: homepage
    label: Homepage Content
    file: src/content/homepage/{{locale}}/index.md
    i18n: true
    fields:
    - label: Page Title
      name: title
      widget: string
      i18n: true
    - label: Description
      name: description
      widget: text
      i18n: true
    - label: SEO Settings
      name: seo
      widget: object
      i18n: true
      fields:
      - label: Meta Title
        name: title
        widget: string
        required: false
        i18n: true
        hint: Custom title for search engines. Defaults to Page Title if empty.
      - label: Meta Description
        name: description
        widget: text
        required: false
        i18n: true
        hint: Meta description for search engines.
      - label: Meta Image
        name: image
        widget: image
        required: false
        i18n: true
    - label: Hero Section
      name: hero
      widget: object
      required: false
      i18n: true
      fields:
      - label: Badge Text
        name: badge_text
        widget: string
        required: false
        i18n: true
      - label: Hero Title
        name: title
        widget: string
        i18n: true
      - label: Hero Description
        name: description
        widget: text
        i18n: true
      - label: CTA Button Text
        name: cta_text
        widget: string
        i18n: true
      - label: CTA Button Link
        name: cta_link
        widget: string
        default: '#contact'
        i18n: true
      - label: Secondary Button Text
        name: secondary_cta_text
        widget: string
        required: false
        i18n: true
      - label: Secondary Button Link
        name: secondary_cta_link
        widget: string
        default: '#portfolio'
        required: false
        i18n: true
      - label: Hero Image
        name: image
        widget: image
        required: false
        i18n: true
      - label: Floating Stat 1
        name: stat_1
        widget: string
        required: false
        i18n: true
      - label: Floating Stat 2
        name: stat_2
        widget: string
        required: false
        i18n: true
    - label: Trusted By Section
      name: trusted
      widget: object
      required: false
      i18n: true
      fields:
      - label: Section Title
        name: title
        widget: string
        required: false
        i18n: true
      - label: Client Logos / Names
        name: items
        widget: list
        required: false
        i18n: true
        field:
          label: Name
          name: name
          widget: string
    - label: Marquee Section
      name: marquee
      widget: object
      required: false
      i18n: true
      fields:
      - label: Keywords / Items
        name: items
        widget: list
        required: false
        i18n: true
        field:
          label: Keyword
          name: keyword
          widget: string
    - label: Numbers / Key Metrics Section
      name: numbers
      widget: object
      required: false
      i18n: true
      fields:
      - label: Metrics
        name: items
        widget: list
        required: false
        i18n: true
        fields:
        - label: Number / Value
          name: number
          widget: string
          i18n: true
        - label: Label
          name: label
          widget: string
          i18n: true
    - label: About Section
      name: about
      widget: object
      required: false
      i18n: true
      fields:
      - label: Eyebrow
        name: eyebrow
        widget: string
        required: false
        i18n: true
      - label: Heading
        name: heading
        widget: string
        i18n: true
      - label: Paragraph 1
        name: p1
        widget: text
        i18n: true
      - label: Paragraph 2
        name: p2
        widget: text
        required: false
        i18n: true
      - label: Image
        name: image
        widget: image
        required: false
        i18n: true
      - label: CTA Button Text
        name: cta_text
        widget: string
        required: false
        i18n: true
      - label: CTA Button Link
        name: cta_link
